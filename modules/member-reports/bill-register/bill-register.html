<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Register — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="bill-register.css">
  <!-- Styled SheetJS for professional Excel (.xlsx) exports -->
  <script src="../../../assets/js/xlsx-js-style.bundle.js"></script>
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-receipt-cutoff text-primary"></i>
      <span>Member Reports ➔ Bill Register (Charge & Head Breakup)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters to Default (START to CURRENT)">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-success" id="btnExportExcel" title="Export to Excel (.xlsx)">
        <i class="bi bi-file-earmark-excel"></i> Export Excel
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Landscape Document">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-warning" id="btnExportPdf" title="Save / Export as PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <!-- 1. Bill Type Filter -->
    <div class="filter-group" style="min-width: 150px;">
      <label class="filter-label"><i class="bi bi-tag"></i> Bill Type:</label>
      <select class="filter-input" id="filterBillType">
        <option value="0">All Bill Types</option>
      </select>
    </div>

    <!-- 2. Period Preset Filter -->
    <div class="filter-group" style="min-width: 155px;">
      <label class="filter-label"><i class="bi bi-calendar-range"></i> Time Period:</label>
      <select class="filter-input" id="filterPeriodPreset">
        <option value="start_current" selected>START to CURRENT</option>
        <option value="current_month">Current Month</option>
        <option value="last_month">Last Month</option>
        <option value="q1">Q1 (Apr - Jun)</option>
        <option value="q2">Q2 (Jul - Sep)</option>
        <option value="q3">Q3 (Oct - Dec)</option>
        <option value="q4">Q4 (Jan - Mar)</option>
        <option value="full_fy">Full Financial Year</option>
        <option value="custom">Custom Date Range</option>
      </select>
    </div>

    <!-- 3. From Date -->
    <div class="filter-group" style="width: 135px;">
      <label class="filter-label">From Date:</label>
      <input type="date" class="filter-input" id="filterDateFrom">
    </div>

    <!-- 4. To Date -->
    <div class="filter-group" style="width: 135px;">
      <label class="filter-label">To Date:</label>
      <input type="date" class="filter-input" id="filterDateTo">
    </div>

    <!-- 5. Wing Filter -->
    <div class="filter-group" style="width: 100px;">
      <label class="filter-label">Wing:</label>
      <input type="text" class="filter-input" id="filterWing" placeholder="All">
    </div>

    <!-- 6. GST Classification Filter (applicable if GST Society) -->
    <div class="filter-group" id="groupGstFilter" style="width: 140px;">
      <label class="filter-label">GST Category:</label>
      <select class="filter-input" id="filterGstCategory">
        <option value="all">All Members</option>
        <option value="gst">Registered (GST)</option>
        <option value="nongst">Residential (Non-GST)</option>
      </select>
    </div>

    <!-- 7. Search Member / Code -->
    <div class="filter-group" style="min-width: 150px; flex-grow: 1;">
      <label class="filter-label">Search:</label>
      <input type="text" class="filter-input" id="filterSearch" placeholder="Filter by Member / Flat / Bill No">
    </div>

    <!-- Action Buttons -->
    <div class="filter-group" style="align-self: flex-end; display: flex; gap: 6px;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Metrics Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display: flex;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Bills:</span>
      <span class="kpi-val" id="kpiTotalBills">0</span>
    </div>
    <div class="kpi-pill" id="kpiExemptPill" style="display:none;">
      <span class="kpi-lbl">GST Exempt:</span>
      <span class="kpi-val" id="kpiTotalExempt">₹0.00</span>
    </div>
    <div class="kpi-pill" id="kpiTaxablePill" style="display:none;">
      <span class="kpi-lbl">Taxable Base:</span>
      <span class="kpi-val" id="kpiTotalTaxable">₹0.00</span>
    </div>
    <div class="kpi-pill" id="kpiTaxPill" style="display:none;">
      <span class="kpi-lbl">Total GST (18%):</span>
      <span class="kpi-val" id="kpiTotalTax">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Principal:</span>
      <span class="kpi-val" id="kpiTotalPrincipal">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Interest:</span>
      <span class="kpi-val" id="kpiTotalInterest">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Arrears:</span>
      <span class="kpi-val" id="kpiTotalArrears">₹0.00</span>
    </div>
    <div class="kpi-pill" style="border-left: 2px solid var(--br-primary);">
      <span class="kpi-lbl">Grand Total Bill:</span>
      <span class="kpi-val" id="kpiGrandTotal" style="color:var(--br-primary); font-weight:800;">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="billRegisterContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <!-- Dynamic Bill Register Rendered Here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="bill-register.js"></script>
</body>
</html>
